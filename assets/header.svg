<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Guilherme Alves — Cybersecurity Student · Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C12"/>
      <stop offset="1" stop-color="#0D131C"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.14;0.2;0.14" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tClip">
      <rect x="290" y="100" width="0" height="80">
        <animate attributeName="width" values="0;620" calcMode="spline" keySplines="0.25 1 0.5 1" dur="1.4s" fill="freeze" begin="0.4s"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="url(#bgGrad)"/>

  <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.5" fill="#1C2733"/>
  </pattern>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <g opacity="0.045">
    <rect width="1200" height="2" fill="#3B82F6">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,340;0,0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="1200" height="2" fill="url(#lineGrad)"/>
  <rect x="0" y="338" width="1200" height="2" fill="url(#lineGrad)" opacity="0.4"/>

  <!-- math formulas background -->
  <g font-family="monospace" fill="#60A5FA" opacity="0.3">
    <text x="80" y="60" font-size="15">H = -Σ p·log₂(p)</text>
    <text x="900" y="55" font-size="14">σ(z) = 1/(1+e⁻ᶻ)</text>
    <text x="90" y="300" font-size="13">0b1010 &lt;&lt; 2 = 0b101000</text>
    <text x="870" y="310" font-size="13">01001000 01100101</text>
    <text x="110" y="170" font-size="12">0xDEADBEEF</text>
    <text x="970" y="180" font-size="13">z = w·x + b</text>
  </g>

  <g font-family="monospace" font-size="12" fill="#8B98A8" opacity="0.25">
    <text x="150" y="70">0x7F 0x45 0x4C 0x46</text>
    <text x="150" y="88">eth0: 10.0.2.15</text>
    <text x="950" y="250">tcp/443 → ESTABLISHED</text>
  </g>

  <!-- title -->
  <g clip-path="url(#tClip)">
    <text x="600" y="155" text-anchor="middle" font-family="sans-serif" font-size="56" font-weight="700" letter-spacing="7" fill="url(#titleGrad)">GUILHERME ALVES</text>
  </g>
  <rect x="535" y="180" width="130" height="2.5" rx="1.25" fill="url(#titleGrad)"/>

  <!-- direct text -->
  <text x="600" y="218" text-anchor="middle" font-family="sans-serif" font-size="20" letter-spacing="3" fill="#E6EDF3">Cybersecurity Student · Developer</text>

  <g font-family="monospace" font-size="16" text-anchor="middle">
    <text x="600" y="252" fill="#8B98A8">gui@security-lab</text>
    <text x="713" y="252" fill="#3B82F6">linux user</text>
  </g>

  <!-- typewriter line -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <text x="600" y="300" fill="#8B98A8" opacity="0">building security knowledge · always learning.</text>
  </g>
</svg>
