<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Guilherme Alves — em trilha para engenheiro de segurança · dia 2/365">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1C2733"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#lineGrad)"/>
  <rect x="0" y="318" width="1200" height="2" fill="url(#lineGrad)" opacity="0.4"/>

  <!-- faint binary / hex -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8B949E" opacity="0.14">
    <text x="40" y="250">00000000 00000010</text>
    <text x="1160" y="250" text-anchor="end">0x02</text>
  </g>

  <!-- top row -->
  <text x="40" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8B949E">~/roadmap-365</text>
  <rect x="158" y="18" width="8" height="15" fill="#38BDF8" opacity="0.9"/>
  <text x="1160" y="30" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8B949E">day 02 · 00000010</text>

  <!-- title -->
  <text x="600" y="145" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="6" fill="url(#titleGrad)">GUILHERME ALVES</text>
  <rect x="545" y="168" width="110" height="3" rx="1.5" fill="url(#titleGrad)" opacity="0.9"/>

  <!-- tagline -->
  <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" letter-spacing="1.5" fill="#8B949E">em trilha para engenheiro de segurança · estudando desde 2026</text>

  <!-- progress -->
  <rect x="430" y="222" width="340" height="8" rx="4" fill="#111820" stroke="#1C2733" stroke-width="1.5"/>
  <rect x="434" y="224" width="5" height="4" rx="2" fill="#2DD4BF"/>
  <text x="600" y="252" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8B949E">dia 2 / 365 · ~0,5%</text>

  <!-- bottom row -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text x="40" y="300" fill="#38BDF8">$</text>
    <text x="58" y="300" fill="#E6EDF3">./next</text>
    <text x="122" y="300" fill="#8B949E">--topic</text>
    <text x="196" y="300" fill="#2DD4BF">endianness</text>
    <rect x="290" y="285" width="8" height="15" fill="#38BDF8" opacity="0.9"/>
  </g>
  <text x="1160" y="300" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#4ADE80">status: em andamento</text>
</svg>
