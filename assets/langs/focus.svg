<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Foco atual">
  <defs>
    <linearGradient id="fcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D131C"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <radialGradient id="fcGlow" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fcBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- card base -->
  <rect x="1" y="1" width="718" height="338" rx="12" fill="url(#fcBg)" stroke="#202B38" stroke-width="1.5"/>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="url(#fcGlow)"/>

  <!-- header -->
  <rect x="1" y="1" width="718" height="52" rx="12" fill="#111923"/>
  <rect x="1" y="27" width="718" height="26" fill="#111923"/>
  <text x="32" y="33" font-family="ui-monospace,SFMono-Regular,monospace" font-size="16" fill="#3B82F6">// foco atual</text>
  <text x="688" y="33" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">focus</text>

  <rect x="32" y="62" width="656" height="1" fill="#202B38"/>

  <!-- cybersecurity -->
  <text x="32" y="96" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">cybersecurity</text>
  <text x="688" y="96" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#22D3EE">70%</text>
  <rect x="32" y="107" width="656" height="7" rx="3.5" fill="#1C2733"/>
  <rect x="32" y="107" width="459" height="7" rx="3.5" fill="url(#fcBar)"/>

  <!-- python -->
  <text x="32" y="146" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">python · automação</text>
  <text x="688" y="146" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#22D3EE">80%</text>
  <rect x="32" y="157" width="656" height="7" rx="3.5" fill="#1C2733"/>
  <rect x="32" y="157" width="525" height="7" rx="3.5" fill="url(#fcBar)"/>

  <!-- low level -->
  <text x="32" y="196" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">low level (c · assembly)</text>
  <text x="688" y="196" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">50%</text>
  <rect x="32" y="207" width="656" height="7" rx="3.5" fill="#1C2733"/>
  <rect x="32" y="207" width="328" height="7" rx="3.5" fill="url(#fcBar)" opacity="0.8"/>

  <!-- redes -->
  <text x="32" y="246" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">redes</text>
  <text x="688" y="246" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">55%</text>
  <rect x="32" y="257" width="656" height="7" rx="3.5" fill="#1C2733"/>
  <rect x="32" y="257" width="361" height="7" rx="3.5" fill="url(#fcBar)" opacity="0.8"/>

  <!-- divider -->
  <rect x="32" y="280" width="656" height="1" fill="#202B38"/>

  <!-- roadmap -->
  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="12">
    <text x="32" y="302" fill="#8B98A8">roadmap:</text>
    <text x="92" y="302" fill="#E6EDF3">M0 → M25</text>
    <text x="32" y="322" fill="#8B98A8" opacity="0.85">fundamentos → binário/hex → C & memória → assembly → exploit dev</text>
  </g>
