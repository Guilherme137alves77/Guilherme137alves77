<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Ferramentas e ambiente">
  <defs>
    <linearGradient id="tlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D131C"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <radialGradient id="tlGlow" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tlChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="1" stop-color="#0D131C"/>
    </linearGradient>
  </defs>

  <!-- card base -->
  <rect x="1" y="1" width="718" height="358" rx="12" fill="url(#tlBg)" stroke="#202B38" stroke-width="1.5"/>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="url(#tlGlow)"/>

  <!-- header -->
  <rect x="1" y="1" width="718" height="52" rx="12" fill="#111923"/>
  <rect x="1" y="27" width="718" height="26" fill="#111923"/>
  <text x="32" y="33" font-family="ui-monospace,SFMono-Regular,monospace" font-size="16" fill="#22D3EE">// ambiente & ferramentas</text>
  <text x="688" y="33" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">toolchain</text>

  <rect x="32" y="62" width="656" height="1" fill="#202B38"/>

  <!-- sistemas -->
  <text x="32" y="92" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#3B82F6">sistemas</text>
  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">
    <rect x="32" y="102" width="132" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="46" y="120" fill="#E6EDF3">linux (fedora)</text>
    
    <rect x="174" y="102" width="60" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="188" y="120" fill="#E6EDF3">git</text>
    
    <rect x="244" y="102" width="86" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="258" y="120" fill="#E6EDF3">docker</text>
  </g>

  <!-- low level -->
  <text x="32" y="162" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#3B82F6">low level</text>
  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">
    <rect x="32" y="172" width="66" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="46" y="190" fill="#E6EDF3">gcc</text>
    
    <rect x="108" y="172" width="62" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="122" y="190" fill="#E6EDF3">xxd</text>
    
    <rect x="180" y="172" width="58" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="194" y="190" fill="#E6EDF3">od</text>
    
    <rect x="248" y="172" width="62" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="262" y="190" fill="#E6EDF3">file</text>
  </g>

  <!-- security -->
  <text x="32" y="232" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#3B82F6">segurança</text>
  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">
    <rect x="32" y="242" width="104" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="46" y="260" fill="#E6EDF3">wireshark</text>
    
    <rect x="146" y="242" width="128" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="160" y="260" fill="#E6EDF3">mitre att&ck</text>
    
    <rect x="284" y="242" width="118" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="298" y="260" fill="#E6EDF3">tryhackme</text>
    
    <rect x="412" y="242" width="102" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="426" y="260" fill="#E6EDF3">hackthebox</text>
    
    <rect x="524" y="242" width="110" height="28" rx="6" fill="url(#tlChip)" stroke="#202B38"/>
    <text x="538" y="260" fill="#E6EDF3">portswigger</text>
  </g>

  <!-- em estudo -->
  <text x="32" y="302" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#22D3EE">em estudo</text>
  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">
    <rect x="32" y="312" width="120" height="28" rx="6" fill="#111923" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="46" y="330" fill="#60A5FA">assembly x86</text>
    
    <rect x="162" y="312" width="56" height="28" rx="6" fill="#111923" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="176" y="330" fill="#60A5FA">gdb</text>
    
    <rect x="228" y="312" width="92" height="28" rx="6" fill="#111923" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="242" y="330" fill="#60A5FA">radare2</text>
  </g>
</svg>
