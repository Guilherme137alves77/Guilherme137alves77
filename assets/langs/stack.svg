  <!-- em estudo -->
  <g font-family="monospace" font-size="11">
    <text x="28" y="405" fill="#22D3EE">em estudo:</text>
    <text x="28" y="439" fill="#3B82F6" opacity="0.9">assembly x86 · gdb · radare2</text>
  </g>
