  <rect x="420" y="252" width="200" height="4" rx="2" fill="#1C2733"/>
  <rect x="420" y="252" width="80" height="4" rx="2" fill="url(#stBarIni)"/>
  <rect x="420" y="278" width="200" height="4" rx="2" fill="#1C2733"/>
  <rect x="420" y="278" width="90" height="4" rx="2" fill="url(#stBarIni)"/>
  <rect x="420" y="304" width="200" height="4" rx="2" fill="#1C2733"/>
  <rect x="420" y="304" width="80" height="4" rx="2" fill="url(#stBarIni)"/>
  <rect x="420" y="330" width="200" height="4" rx="2" fill="#1C2733"/>
  <rect x="420" y="330" width="70" height="4" rx="2" fill="url(#stBarIni)"/>

  <rect x="24" y="356" width="672" height="1" fill="#202B38"/>

  <!-- TOOLS -->
  <text x="28" y="380" font-family="monospace" font-size="12" fill="#8B98A8">ambiente</text>

  <g font-family="monospace" font-size="12">
    <rect x="28" y="390" width="66" height="26" rx="6" fill="url(#stChip)" stroke="#202B38"/>
    <text x="40" y="407" fill="#E6EDF3">linux</text>
    <rect x="100" y="390" width="54" height="26" rx="6" fill="url(#stChip)" stroke="#202B38"/>
    <text x="112" y="407" fill="#E6EDF3">git</text>
    <rect x="160" y="390" width="72" height="26" rx="6" fill="url(#stChip)" stroke="#202B38"/>
