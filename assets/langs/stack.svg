    <rect x="266" y="422" width="102" height="26" rx="6" fill="url(#stChip)" stroke="#202B38"/>
    <text x="278" y="439" fill="#E6EDF3">tryhackme</text>
    <rect x="374" y="422" width="104" height="26" rx="6" fill="url(#stChip)" stroke="#202B38"/>
    <text x="386" y="439" fill="#E6EDF3">hackthebox</text>
    <rect x="484" y="422" width="104" height="26" rx="6" fill="url(#stChip)" stroke="#202B38"/>
    <text x="496" y="439" fill="#E6EDF3">portswigger</text>
