  <text x="28" y="234" font-family="monospace" font-size="12" fill="#8B98A8">linguagens</text>

  <text x="28" y="260" font-family="monospace" font-size="13" fill="#E6EDF3">python</text>
  <text x="28" y="286" font-family="monospace" font-size="13" fill="#E6EDF3">html/css</text>
  <text x="28" y="312" font-family="monospace" font-size="13" fill="#E6EDF3">javascript</text>
  <text x="28" y="338" font-family="monospace" font-size="13" fill="#E6EDF3">bash/shell</text>

  <text x="360" y="260" font-family="monospace" font-size="13" fill="#E6EDF3">node.js</text>
  <text x="360" y="286" font-family="monospace" font-size="13" fill="#E6EDF3">sql (sqlite)</text>
  <text x="360" y="312" font-family="monospace" font-size="13" fill="#E6EDF3">lua</text>
  <text x="360" y="338" font-family="monospace" font-size="13" fill="#E6EDF3">c</text>

  <!-- bars col A -->
  <rect x="110" y="252" width="200" height="4" rx="2" fill="#1C2733"/>
  <rect x="110" y="252" width="140" height="4" rx="2" fill="url(#stBar)"/>
  <rect x="110" y="278" width="200" height="4" rx="2" fill="#1C2733"/>
  <rect x="110" y="278" width="160" height="4" rx="2" fill="url(#stBar)"/>
  <rect x="110" y="304" width="200" height="4" rx="2" fill="#1C2733"/>
  <rect x="110" y="304" width="140" height="4" rx="2" fill="url(#stBar)"/>
  <rect x="110" y="330" width="200" height="4" rx="2" fill="#1C2733"/>
  <rect x="110" y="330" width="130" height="4" rx="2" fill="url(#stBar)"/>

