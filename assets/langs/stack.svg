<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="Stack técnica">
  <defs>
    <linearGradient id="stBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D131C"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <linearGradient id="stBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="stBarIni" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="stChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="1" stop-color="#0D131C"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="718" height="458" rx="12" fill="url(#stBg)" stroke="#202B38"/>

  <!-- header -->
  <rect x="1" y="1" width="718" height="48" rx="12" fill="#111923"/>
  <rect x="1" y="24" width="718" height="25" fill="#111923"/>
  <text x="28" y="31" font-family="monospace" font-size="16" fill="#3B82F6">// stack</text>
  <text x="692" y="31" text-anchor="end" font-family="monospace" font-size="11" fill="#8B98A8">M0 → M25</text>

  <rect x="24" y="56" width="672" height="1" fill="#202B38"/>

  <!-- FOCUS -->
  <text x="28" y="80" font-family="monospace" font-size="12" fill="#8B98A8">foco atual</text>

  <text x="28" y="106" font-family="monospace" font-size="13" fill="#E6EDF3">cybersecurity</text>
  <text x="560" y="106" text-anchor="end" font-family="monospace" font-size="11" fill="#22D3EE">70%</text>
  <rect x="28" y="114" width="532" height="4" rx="2" fill="#1C2733"/>
  <rect x="28" y="114" width="372" height="4" rx="2" fill="url(#stBar)"/>

  <text x="28" y="132" font-family="monospace" font-size="13" fill="#E6EDF3">python · automação</text>
  <text x="560" y="132" text-anchor="end" font-family="monospace" font-size="11" fill="#22D3EE">80%</text>
  <rect x="28" y="140" width="532" height="4" rx="2" fill="#1C2733"/>
  <rect x="28" y="140" width="426" height="4" rx="2" fill="url(#stBar)"/>

  <text x="28" y="158" font-family="monospace" font-size="13" fill="#E6EDF3">low level (c · assembly)</text>
  <text x="560" y="158" text-anchor="end" font-family="monospace" font-size="11" fill="#8B98A8">50%</text>
  <rect x="28" y="166" width="532" height="4" rx="2" fill="#1C2733"/>
  <rect x="28" y="166" width="266" height="4" rx="2" fill="url(#stBar)" opacity="0.8"/>

  <text x="28" y="184" font-family="monospace" font-size="13" fill="#E6EDF3">redes</text>
  <text x="560" y="184" text-anchor="end" font-family="monospace" font-size="11" fill="#8B98A8">55%</text>
  <rect x="28" y="192" width="532" height="4" rx="2" fill="#1C2733"/>
  <rect x="28" y="192" width="293" height="4" rx="2" fill="url(#stBar)" opacity="0.8"/>

  <rect x="24" y="210" width="672" height="1" fill="#202B38"/>

