    <rect x="298" y="390" width="52" height="26" rx="6" fill="url(#stChip)" stroke="#202B38"/>
    <text x="310" y="407" fill="#E6EDF3">xxd</text>
    <rect x="356" y="390" width="50" height="26" rx="6" fill="url(#stChip)" stroke="#202B38"/>
