<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Linguagens e níveis">
  <defs>
    <linearGradient id="skBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D131C"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <linearGradient id="skBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="skBarIni" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="skBarBas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="skGlow" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="718" height="418" rx="12" fill="url(#skBg)" stroke="#202B38" stroke-width="1.5"/>
  <rect x="1" y="1" width="718" height="418" rx="12" fill="url(#skGlow)"/>

  <!-- header -->
  <rect x="1" y="1" width="718" height="52" rx="12" fill="#111923"/>
  <rect x="1" y="28" width="718" height="25" fill="#111923"/>
  <text x="32" y="33" font-family="ui-monospace,SFMono-Regular,monospace" font-size="16" fill="#3B82F6">// linguagens</text>
  <text x="688" y="33" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">skill map</text>

  <!-- divider -->
  <rect x="32" y="62" width="656" height="1" fill="#202B38"/>

  <!-- row 1: Python e HTML -->
  <text x="32" y="92" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">python</text>
  <text x="688" y="92" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#22D3EE">iniciante/inter</text>
  <rect x="32" y="101" width="656" height="6" rx="3" fill="#1C2733"/>
  <rect x="32" y="101" width="460" height="6" rx="3" fill="url(#skBar)"/>

  <text x="32" y="132" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">html/css</text>
  <text x="688" y="132" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#22D3EE">intermediário</text>
  <rect x="32" y="141" width="656" height="6" rx="3" fill="#1C2733"/>
  <rect x="32" y="141" width="525" height="6" rx="3" fill="url(#skBar)"/>

  <!-- row 2: JavaScript e Node -->
  <text x="32" y="172" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">javascript</text>
  <text x="688" y="172" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#22D3EE">iniciante/inter</text>
  <rect x="32" y="181" width="656" height="6" rx="3" fill="#1C2733"/>
  <rect x="32" y="181" width="460" height="6" rx="3" fill="url(#skBar)"/>

  <text x="32" y="212" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">node.js</text>
  <text x="688" y="212" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">iniciante</text>
  <rect x="32" y="221" width="656" height="6" rx="3" fill="#1C2733"/>
  <rect x="32" y="221" width="260" height="6" rx="3" fill="url(#skBarIni)"/>

  <!-- row 3: Bash e SQL -->
  <text x="32" y="252" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">bash/shell</text>
  <text x="688" y="252" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#22D3EE">iniciante/inter</text>
  <rect x="32" y="261" width="656" height="6" rx="3" fill="#1C2733"/>
  <rect x="32" y="261" width="430" height="6" rx="3" fill="url(#skBar)"/>

  <text x="32" y="292" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">sql (sqlite)</text>
  <text x="688" y="292" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">iniciante</text>
  <rect x="32" y="301" width="656" height="6" rx="3" fill="#1C2733"/>
  <rect x="32" y="301" width="280" height="6" rx="3" fill="url(#skBarBas)"/>

  <!-- row 4: Lua e C -->
  <text x="32" y="332" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">lua</text>
  <text x="688" y="332" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">iniciante</text>
  <rect x="32" y="341" width="656" height="6" rx="3" fill="#1C2733"/>
  <rect x="32" y="341" width="240" height="6" rx="3" fill="url(#skBarBas)"/>

  <text x="32" y="372" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#E6EDF3">C</text>
  <text x="688" y="372" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8B98A8">iniciante</text>
  <rect x="32" y="381" width="656" height="6" rx="3" fill="#1C2733"/>
  <rect x="32" y="381" width="230" height="6" rx="3" fill="url(#skBarIni)"/>

  <!-- footer -->
  <text x="32" y="404" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#8B98A8" opacity="0.7">níveis por evolução do código · sempre em construção</text>
  <rect x="705" y="392" width="8" height="16" rx="2" fill="#3B82F6" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
