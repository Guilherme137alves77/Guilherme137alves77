<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Estudante · tecnologias">
  <defs>
    <linearGradient id="wmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <radialGradient id="wmGlow" cx="0.6" cy="0" r="0.7">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wmUser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="718" height="238" rx="12" fill="url(#wmBg)" stroke="#30363D"/>
  <rect x="1" y="1" width="718" height="238" rx="12" fill="url(#wmGlow)"/>

  <!-- title bar -->
  <rect x="1" y="1" width="718" height="44" rx="12" fill="#161B22"/>
  <rect x="1" y="22" width="718" height="23" fill="#161B22"/>
  <circle cx="24" cy="22" r="6" fill="#8B949E" opacity="0.35"/>
  <circle cx="42" cy="22" r="6" fill="#8B949E" opacity="0.25"/>
  <circle cx="60" cy="22" r="6" fill="#8B949E" opacity="0.18"/>
  <text x="360" y="26" text-anchor="middle" font-family="monospace" font-size="13" fill="#8B949E">guilherme@terminal — zsh</text>

  <rect x="24" y="52" width="672" height="1" fill="#30363D"/>

  <!-- prompt + whoami -->
  <g font-family="monospace" font-size="15">
    <text x="32" y="82" fill="#58A6FF">$ whoami</text>
  </g>

  <!-- output -->
  <text x="32" y="120" font-family="monospace" font-size="24" font-weight="700" fill="url(#wmUser)">estudante@transicao</text>
  <text x="32" y="152" font-family="monospace" font-size="15" fill="#E6EDF3">Estudante · Sistemas de Informação</text>
  <text x="32" y="178" font-family="monospace" font-size="15" fill="#E6EDF3">Java · testes</text>
  <text x="32" y="204" font-family="monospace" font-size="15" fill="#E6EDF3">Python · automação</text>
  <text x="32" y="230" font-family="monospace" font-size="15" fill="#58A6FF">transição de carreira para tecnologia.</text>

  <!-- blinking cursor -->
  <rect x="170" y="216" width="9" height="18" rx="1" fill="#58A6FF" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
