<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="whoami — identidade técnica">
  <defs>
    <linearGradient id="wmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D131C"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <radialGradient id="wmGlow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wmUser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- typewriter clips -->
    <clipPath id="wm1">
      <rect x="92" y="74" width="0" height="20"><animate attributeName="width" values="0;70" dur="0.3s" fill="freeze" begin="0.5s"/></rect>
    </clipPath>
    <clipPath id="wm2">
      <rect x="32" y="108" width="0" height="20"><animate attributeName="width" values="0;230" dur="0.4s" fill="freeze" begin="1.2s"/></rect>
    </clipPath>
    <clipPath id="wm3">
      <rect x="32" y="148" width="0" height="20"><animate attributeName="width" values="0;210" dur="0.4s" fill="freeze" begin="1.9s"/></rect>
    </clipPath>
    <clipPath id="wm4">
      <rect x="32" y="186" width="0" height="20"><animate attributeName="width" values="0;150" dur="0.3s" fill="freeze" begin="2.5s"/></rect>
    </clipPath>
    <clipPath id="wm5">
      <rect x="32" y="222" width="0" height="20"><animate attributeName="width" values="0;175" dur="0.35s" fill="freeze" begin="3s"/></rect>
    </clipPath>
  </defs>

  <!-- terminal window -->
  <rect x="1" y="1" width="718" height="298" rx="12" fill="url(#wmBg)" stroke="#202B38" stroke-width="1.5"/>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="url(#wmGlow)"/>

  <!-- title bar -->
  <rect x="1" y="1" width="718" height="46" rx="12" fill="#111923"/>
  <rect x="1" y="24" width="718" height="23" fill="#111923"/>
  <circle cx="24" cy="23" r="6" fill="#8B98A8" opacity="0.35"/>
  <circle cx="42" cy="23" r="6" fill="#8B98A8" opacity="0.25"/>
  <circle cx="60" cy="23" r="6" fill="#8B98A8" opacity="0.18"/>
  <text x="360" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#8B98A8">gui@security-lab</text>
  <rect x="672" y="14" width="36" height="18" rx="4" fill="#1C2733"/>
  <text x="690" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8B98A8">bash</text>

  <rect x="24" y="56" width="672" height="1" fill="#202B38"/>

  <!-- prompt + whoami -->
  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="15">
    <text x="32" y="90" fill="#22D3EE">$</text>
    <g clip-path="url(#wm1)">
      <text x="46" y="90" fill="#E6EDF3">whoami</text>
    </g>
  </g>

  <!-- gauge sidebar -->
  <g opacity="0.5">
    <text x="600" y="90" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#8B98A8">uid=1000(gui) gid=1000(gui)</text>
    <text x="600" y="108" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#8B98A8">groups=wheel,libvirt,kvm</text>
  </g>

  <!-- output lines -->
  <g clip-path="url(#wm2)">
    <text x="32" y="124" font-family="ui-monospace,SFMono-Regular,monospace" font-size="22" font-weight="700" fill="url(#wmUser)">guilherme@security-lab</text>
  </g>

  <g clip-path="url(#wm3)">
    <text x="32" y="162" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#E6EDF3">cybersecurity student</text>
    <text x="245" y="162" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#8B98A8">· developer · linux user</text>
  </g>

  <g clip-path="url(#wm4)">
    <text x="32" y="200" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#3B82F6">building security knowledge</text>
  </g>

  <g clip-path="url(#wm5)">
    <text x="32" y="236" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#E6EDF3">from fundamentals to</text>
    <text x="200" y="236" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#22D3EE">low level</text>
  </g>

  <!-- blinking cursor -->
  <rect x="32" y="248" width="9" height="18" rx="1" fill="#22D3EE" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1;0;1" dur="1.6s" begin="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- status bar -->
  <rect x="24" y="274" width="672" height="1" fill="#202B38"/>
  <text x="32" y="290" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#8B98A8">M0 → M25</text>
  <text x="688" y="290" text-anchor="end" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#3B82F6">security-lab · always learning</text>
</svg>
