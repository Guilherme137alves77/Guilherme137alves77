<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="whoami">
  <defs>
    <linearGradient id="wmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D131C"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <radialGradient id="wmGlow" cx="0.6" cy="0" r="0.7">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wmUser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="718" height="238" rx="12" fill="url(#wmBg)" stroke="#202B38"/>
  <rect x="1" y="1" width="718" height="238" rx="12" fill="url(#wmGlow)"/>

  <!-- title bar -->
  <rect x="1" y="1" width="718" height="44" rx="12" fill="#111923"/>
  <rect x="1" y="22" width="718" height="23" fill="#111923"/>
  <circle cx="24" cy="22" r="6" fill="#8B98A8" opacity="0.35"/>
  <circle cx="42" cy="22" r="6" fill="#8B98A8" opacity="0.25"/>
  <circle cx="60" cy="22" r="6" fill="#8B98A8" opacity="0.18"/>
  <text x="360" y="26" text-anchor="middle" font-family="monospace" font-size="13" fill="#8B98A8">gui@security-lab — bash</text>

  <rect x="24" y="52" width="672" height="1" fill="#202B38"/>

  <!-- prompt + whoami -->
  <g font-family="monospace" font-size="15">
    <text x="32" y="82" fill="#22D3EE">$ whoami</text>
  </g>

  <!-- output -->
  <text x="32" y="120" font-family="monospace" font-size="24" font-weight="700" fill="url(#wmUser)">guilherme@security-lab</text>
  <text x="32" y="152" font-family="monospace" font-size="15" fill="#E6EDF3">Cybersecurity student</text>
  <text x="32" y="178" font-family="monospace" font-size="15" fill="#E6EDF3">Developer</text>
  <text x="32" y="204" font-family="monospace" font-size="15" fill="#E6EDF3">Linux user</text>
  <text x="32" y="230" font-family="monospace" font-size="15" fill="#3B82F6">Always learning.</text>

  <!-- blinking cursor -->
  <rect x="170" y="216" width="9" height="18" rx="1" fill="#22D3EE" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
